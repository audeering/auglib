name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    # Make sure .bashrc is read by shell for micromamba,
    # see https://github.com/mamba-org/setup-micromamba#about-login-shells
    defaults:
      run:
        shell: bash -l {0}

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04, macOS-latest, windows-latest ]
        python-version: [ '3.12' ]
        include:
          - os: ubuntu-24.04
            python-version: '3.10'
            tasks: tests
          - os: ubuntu-24.04
            python-version: '3.11'
            tasks: tests
          - os: ubuntu-24.04
            python-version: '3.13'
            tasks: tests
          - os: ubuntu-24.04
            python-version: '3.14'
            tasks: tests

    steps:
    - uses: actions/checkout@v7

    - name: Cache emodb
      uses: actions/cache@v6
      with:
        path: ~/audb/emodb/1.4.1
        key: emodb-1.4.1

    - name: Set up Python ${{ matrix.python-version }} with Micromamba
      uses: mamba-org/setup-micromamba@v2
      with:
        cache-environment: true
        environment-name: .venv
        create-args: >-
          uv
          python=${{ matrix.python-version }}

    - name: Activate Python virtual environment
      run: micromamba activate .venv

    - name: Install sox with Micromamba
      run: micromamba install sox

    - name: Ubuntu - install audio packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libsndfile1 ffmpeg libavcodec-extra60
      if: matrix.os == 'ubuntu-24.04'

    - name: OSX - install audio packages
      run: |
        curl -L -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip
        unzip -o ffmpeg.zip
        sudo mv -f ffmpeg /usr/local/bin/ffmpeg
        sudo chmod +x /usr/local/bin/ffmpeg
        brew install mediainfo
      if: matrix.os == 'macOS-latest'

    - name: Windows - install audio packages
      run: choco install ffmpeg mediainfo-cli
      if: matrix.os == 'windows-latest'

    - name: Sync Python environment
      run: uv sync --active

    - name: Test with pytest
      run: uv run --active pytest

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
      if: matrix.os == 'ubuntu-24.04'
